<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Jukebox Karaoke Queue</title>
<style>
  :root {
    --bg: #1c0870;
    --fg: #ffffff;
    --dim: rgba(255,255,255,.66);
    --line: rgba(255,255,255,.16);
    --yellow: #fcff00;
    --teal: #00a3a3;
    --blue: #1f7cf0;
    --indigo: #4a1dff;
    --purple: #a03ae6;
    --accent: var(--yellow);
    --accent2: #3fd4d4;
  }
  * { box-sizing: border-box; }
  /* Silk on Fire TV hides its address bar once a page scrolls a little, so the page is made
     2px taller than the screen and nudged down (see hideSilkBar). */
  html.silkfix, html.silkfix body { overflow-y: auto !important; overflow-x: hidden; }
  html.silkfix body { min-height: calc(100vh + 300px); }
  html.silkfix .safe { position: fixed; } /* content stays put while the page scrolls */
  /* Purple fade from the logo's indigo (#3A00FF) to its violet (#9226D6), darkened so text stays readable. */
  html, body { margin: 0; height: 100%; background: #1c0870 linear-gradient(135deg, #1c0870 0%, #2a0c9e 40%, #4a1690 75%, #5e1c95 100%); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden; }
  /* 5% safe margins: some TVs crop the edges */
  .safe { position: absolute; inset: 5vh 5vw; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- brand logo (top right) ---------- */
  /* Logo in the top-right corner */
  #brand { position: absolute; top: 0; right: 0; height: 39vh; width: auto; }
  #top { padding-right: 46vh; } /* keep names clear of the logo */

  /* ---------- queue view ---------- */
  .label { font-size: 2.8vh; letter-spacing: .32em; color: #ffc27a; text-transform: uppercase; }

  /* Now singing bar: only while a song is playing. Smaller, green. */
  /* Slow pulse so the current singer "flashes" gently. Opacity only: cheap on a Fire Stick. */
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  /* Now Singing and Up Next share the same box size */
  /* Now Singing and Up Next: same size; big label on the left, name + song on the right */
  #nowBar, #hero { box-sizing: border-box; min-height: 20vh; margin: 0 0 1.4vh; padding: 1.1vh 2vw;
    border-radius: 2.4vh; border: .4vh solid; text-align: left;
    display: flex; flex-direction: row; align-items: center; gap: 2.4vw; }
  .boxLabel { flex: none; min-width: 14vw; font-size: 6.4vh; font-weight: 900; line-height: 1.05;
    letter-spacing: .04em; padding-right: 2vw; border-right: .3vh solid rgba(57,255,136,.45); }
  .boxBody { min-width: 0; flex: 1; }
  #nowBar { animation: pulse 2.6s ease-in-out infinite; color: #39ff88;
    background: rgba(57,255,136,.12); border-color: rgba(57,255,136,.6);
    box-shadow: 0 0 3vh rgba(57,255,136,.25); }
  #nowBarRow { display: flex; align-items: center; gap: 1.4vw; }
  #nowBar .mic { flex: none; height: 7.2vh; width: auto; }
  /* Animated equalizer bars: transform-only animation, light on the Fire Stick */
  .wave { flex: none; display: flex; align-items: center; gap: .6vh; height: 6.4vh; }
  .wave i { display: block; width: 1vh; height: 100%; border-radius: 1vh; background: #39ff88;
    transform-origin: center; animation: eq 1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: -.2s; } .wave i:nth-child(3) { animation-delay: -.5s; }
  .wave i:nth-child(4) { animation-delay: -.8s; } .wave i:nth-child(5) { animation-delay: -.35s; }
  .wave i:nth-child(6) { animation-delay: -.65s; } .wave i:nth-child(7) { animation-delay: -.1s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  #nowBarText { min-width: 0; flex: 1; }
  #nowBarLabel { }
  #nowBarName { min-width: 0; flex: 0 1 auto; font-size: 10.8vh; font-weight: 800; line-height: 1.25; padding-bottom: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowBarSong { font-size: 4.8vh; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Hero: the singer who goes next, big and yellow. Name shrinks to fit (see fitName). */
  #heroLabel { color: var(--accent); border-color: rgba(252,255,0,.45); }
  #hero { background: linear-gradient(90deg, rgba(252,255,0,.16), rgba(252,255,0,.04));
    border-color: rgba(252,255,0,.55); box-shadow: 0 0 4vh rgba(252,255,0,.25); }
  #heroName { font-size: 10.8vh; font-weight: 800; line-height: 1.25; padding-bottom: .05em; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 3vh rgba(252,255,0,.35); }
  #heroSong { font-size: 4.8vh; font-weight: 700; color: var(--fg); opacity: .95; margin-top: .6vh;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #empty { font-size: 8vh; color: var(--dim); margin: 2vh 0 4vh; }
  #nextLabel { font-size: 4vh; font-weight: 800; letter-spacing: .24em; color: #ffc27a; }
  /* Coming up: fills the first column, then a second column, side by side */
  /* Gap and divider between the two big boxes and Coming Up */
  #nextWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 1.6vh; }
  /* Divider stops short of the logo column */
  #top::after { content: ""; display: block; height: .4vh; margin-top: 1.6vh;
    background: linear-gradient(90deg, rgba(255,194,122,.4) 0%, rgba(255,194,122,.4) 55%, rgba(255,194,122,0) 100%); border-radius: .2vh; }
  #list { --s: 1; flex: 1; min-height: 0; overflow: hidden; margin-top: 1vh; display: grid; grid-auto-flow: column;
    grid-template-columns: 1fr; column-gap: 4vw; align-content: start; }
  #list.two { grid-template-columns: 1fr 1fr; }
  .row { min-width: 0; display: flex; align-items: baseline; gap: 1.2vw; padding: calc(var(--s) * .7vh) 0; border-bottom: 1px solid var(--line); }
  .num { width: 4vw; font-size: calc(var(--s) * 3.6vh); color: var(--dim); text-align: right; flex: none; }
  .who { font-size: calc(var(--s) * 6.2vh); font-weight: 800; color: #ff9f1c; line-height: 1.25; flex: 0 1 auto; max-width: 58%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 1.2vw; }
  /* Text too long for its space slides slowly back and forth so the whole title can be read */
  /* Song + artist that don't fit together take turns: title, then artist (see flipText) */
  .mq { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; transition: opacity .35s; }
  .mq.fade { opacity: 0; }
  .what { min-width: 0; flex: 1; font-size: calc(var(--s) * 3.2vh); font-weight: 600; color: rgba(255,255,255,.42); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #more { flex: none; font-size: 2.4vh; color: rgba(255,255,255,.5); margin-top: .8vh; text-align: right;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  #pill { position: absolute; right: 5vw; bottom: 3vh; font-size: 2.8vh; padding: .6vh 1.2vw;
    border-radius: 99px; background: rgba(255,255,255,.08); color: var(--dim); }
  #pill.bad { background: rgba(255,61,90,.18); color: #ffb3c0; }

  /* ---------- menu (any arrow key) ---------- */
  #menu { position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%);
    display: flex; gap: 2vw; background: rgba(20,20,34,.96); padding: 2vh 2vw; border-radius: 2vh;
    border: 1px solid var(--line); }

  /* ---------- code entry ---------- */
  #setup { align-items: center; justify-content: center; text-align: center; }
  #setup h1 { font-size: 5vh; margin: 0 0 1vh; }
  #setup p { font-size: 2.6vh; color: var(--dim); margin: 0 0 3vh; }
  #codeBox { font-size: 8vh; font-weight: 800; letter-spacing: .4em; padding-left: .4em;
    min-height: 11vh; margin-bottom: 3vh; font-variant-numeric: tabular-nums; }
  #codeBox .ph { color: rgba(255,255,255,.18); }
  #pad { display: grid; grid-template-columns: repeat(3, 12vh); gap: 1.6vh; justify-content: center; }
  #setupMsg { min-height: 3.5vh; font-size: 2.6vh; color: #ffb3c0; margin-top: 2.4vh; }

  button { font: inherit; color: var(--fg); background: rgba(255,255,255,.08);
    border: .3vh solid transparent; border-radius: 1.6vh; cursor: pointer; }
  #pad button { height: 10vh; font-size: 4.4vh; font-weight: 700; }
  #pad button.wide { font-size: 2.6vh; }
  #menu button { font-size: 2.8vh; padding: 1.6vh 2.4vw; }
  button:focus { outline: none; border-color: var(--yellow); background: rgba(252,255,0,.16); }
</style>
</head>
<body>

<!-- Code entry: shown until a KaraFun remote code is saved on this device -->
<div id="setup" class="safe hidden">
  <h1>Connect to KaraFun</h1>
  <p>Enter the 6-digit remote control code from KaraFun (Settings → Remote control)</p>
  <div id="codeBox"></div>
  <div id="pad"></div>
  <div id="setupMsg"></div>
</div>

<!-- Queue display -->
<div id="view" class="safe hidden">
  <img id="brand" src="logo.png" alt="">
  <div id="top">
    <div id="nowBar" class="hidden">
      <div id="nowBarLabel" class="boxLabel">NOW<br>SINGING</div>
      <div class="boxBody">
      <div id="nowBarRow">
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="2" width="7" height="12" rx="3.5" fill="currentColor" fill-opacity=".25"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8.5 22h7"/></svg>
        <div id="nowBarName"></div>
        <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div id="nowBarSong" class="mq"></div>
      </div>
    </div>
    <div id="heroWrap">
      <div id="hero">
        <div id="heroLabel" class="boxLabel">UP<br>NEXT</div>
        <div class="boxBody">
          <div id="heroName"></div>
          <div id="heroSong" class="mq"></div>
        </div>
      </div>
    </div>
    <div id="empty" class="hidden">The queue is empty. Sign up to sing!</div>
  </div>
  <div id="nextWrap">
    <div id="nextLabel">COMING UP</div>
    <div id="list"></div>
    <div id="more"></div>
  </div>
  <div id="pill">Connecting…</div>
  <div id="menu" class="hidden">
    <button id="btnFull">Full screen</button>
    <button id="btnCode">Change code</button>
    <button id="btnClose">Close</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KF_HOST = "https://www.karafun.com/";
  var WEBKCS_SRC = "https://cdnaws.recis.io/i/kf/common/js/external/webkcs.min.js";
  var STORE_KEY = "kfqv.code";
  var BLANK_KEY = "kfqv.blank";
  
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // localStorage can throw or come back empty on some browsers; never let it break the page.
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

  // ---------------------------------------------------------------- state
  var params = new URLSearchParams(location.search);
  var code = (params.get("code") || load(STORE_KEY) || "").replace(/\D/g, "");
  // Singer names to treat as "no singer" (e.g. the default name KaraFun fills in when
  // nobody types one). Set with ?blank=Name1,Name2 ; saved on this device.
  if (params.has("blank")) save(BLANK_KEY, params.get("blank"));
  var blankNames = (load(BLANK_KEY) || "").split(",").map(function (n) { return n.trim().toLowerCase(); }).filter(Boolean);
  var client = null;
  var session = null;           // { kcsUrl, hash }
  var queue = [];               // raw KaraFun queue items
  var current = null;           // raw KaraFun current item (from status)
  var playerState = 0;          // KaraFun status.state: 4 = playing, 5 = paused
  var retryTimer = null;

  // ---------------------------------------------------------------- KaraFun session
  // The public remote page embeds a short-lived websocket URL (kcs_url) and a hash
  // that can be exchanged for a fresh URL. KaraFun serves these with
  // Access-Control-Allow-Origin: *, so no server is needed.
  function fetchSession(c) {
    return fetch(KF_HOST + c + "/", { cache: "no-store" }).then(function (r) { return r.text(); })
      .then(function (html) {
        var kcs = (html.match(/"kcs_url"\s*:\s*"([^"]+)"/) || [])[1];
        var hash = (html.match(/"hash"\s*:\s*"([a-f0-9]+)"/) || [])[1];
        if (!kcs) throw new Error("no-session");
        return { kcsUrl: kcs.replace(/\\\//g, "/"), hash: hash };
      });
  }

  function freshUrl() {
    // Used by WebKCS when it reconnects. Try the cheap endpoint first, then the full page.
    var viaHash = session && session.hash
      ? fetch(KF_HOST + code + "/?type=session_info&hash=" + session.hash, { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (!j.kcs_url) throw 0; return j.kcs_url; })
      : Promise.reject();
    return viaHash.catch(function () {
      return fetchSession(code).then(function (s) { session = s; return s.kcsUrl; });
    });
  }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      if (window.WebKCS) return res();
      var s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = function () { rej(new Error("script")); };
      document.head.appendChild(s);
    });
  }

  function connect() {
    clearTimeout(retryTimer);
    setPill("Connecting…", false);
    Promise.all([loadScript(WEBKCS_SRC), fetchSession(code)]).then(function (r) {
      session = r[1];
      startClient(session.kcsUrl);
    }).catch(function (err) {
      if (err && err.message === "no-session") {
        setPill("KaraFun session not found. Is remote control on? Retrying…", true);
      } else {
        setPill("Can't reach KaraFun. Retrying…", true);
      }
      retryLater(8000);
    });
  }

  function retryLater(ms) {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, ms);
  }

  function startClient(url) {
    try { if (client && client.close) client.close(); } catch (e) {}
    var c = WebKCS.Client.fromAddress(url);
    client = c;
    c.setUrlProvider(freshUrl);
    c.setErrorHandler(function (e) { if (window.console) console.log("kcs error", e); });
    c.addReadyHandler(function () { setPill("Live", false); });
    c.setReconnectHandler(function () { setPill("Live", false); });
    c.setLostConnectionHandler(function () { setPill("Connection lost. Reconnecting…", true); });
    c.addCloseHandler(function (e) {
      if (client !== c) return;
      var codeNum = e && e.code;
      // 4220 KaraFun app left, 4210 remote disabled, 4221/4403 invalid session
      if (codeNum === 4220) { setPill("KaraFun app closed. Waiting…", true); setTimeout(function () { try { c.reconnect(); } catch (x) { retryLater(3000); } }, 3000); }
      else if (codeNum === 4210) { setPill("Remote control is off in KaraFun. Waiting…", true); retryLater(10000); }
      else { setPill("Reconnecting…", true); retryLater(4000); }
    });
    c.addEventHandler("remote.AppLeftEvent", function () { setPill("KaraFun app closed. Waiting…", true); });
    c.addEventHandler("remote.AppJoinEvent", function () { setPill("Live", false); });
    c.addEventHandler("remote.StatusEvent", function (e) {
      var st = e && e.data && e.data.status;
      if (!st) return;
      current = st.current || null;
      playerState = st.state || 0;
      render();
    });
    c.addEventHandler("remote.QueueEvent", function (e) {
      var q = e && e.data && e.data.queue;
      queue = (q && q.items) || [];
      render();
    });
  }

  // ---------------------------------------------------------------- rendering
  function info(item) {
    if (!item) return null;
    if (item.quiz) return { singer: "", title: item.quiz.title || "Music quiz", artist: "Quiz" };
    var s = item.song || {};
    var singer = String((s.options && s.options.singer) || "").trim();
    if (blankNames.indexOf(singer.toLowerCase()) !== -1) singer = "";
    return { singer: singer, title: s.title || "", artist: s.artist || "" };
  }

  function line(x) {
    // Big text: singer, or the artist when no singer was entered. Small text: the song.
    return {
      big: x.singer || x.artist || x.title,
      small: x.singer ? (x.title + "  ·  " + x.artist) : x.title
    };
  }

  function render() {
    // The current song is also the first queue item. Use status.current when we have it.
    var cur = current || queue[0] || null;
    var rest = queue.filter(function (it) { return !cur || it.id !== cur.id; });

    // Once the song is actually playing, the singer drops to the small green bar and the
    // next person takes the big spot. Before play is pressed, the loaded song's singer
    // is the one shown big as "UP NEXT".
    var singing = !!cur && (playerState === 4 || playerState === 5);
    var heroItem = singing ? rest[0] : cur;
    var listItems = singing ? rest.slice(1) : rest;

    $("nowBar").classList.toggle("hidden", !singing);
    if (singing) {
      var n = line(info(cur));
      // Singer on the big line (with the mic and VU bars), song underneath.
      $("nowBarName").textContent = n.big;
      $("nowBarSong").textContent = n.small;
    }
    setTimeout(function () { fitName(); marquee(); }, 0);

    $("heroWrap").classList.toggle("hidden", !heroItem);
    if (heroItem) {
      var h = line(info(heroItem));
      $("heroName").textContent = h.big;
      $("heroSong").textContent = h.small;
      fitName();
    }
    $("empty").classList.toggle("hidden", !!cur);

    listState = { items: listItems, perCol: singing ? 3 : 6 };
    $("nextWrap").classList.toggle("hidden", listItems.length === 0);
    renderList();
  }

  // Coming Up: everyone waiting is shown at once. It splits into two columns past
  // a handful of people, and the text shrinks as needed so the whole list fits.
  var listState = { items: [], perCol: 5 };
  function renderList() {
    var all = listState.items;
    var items = all.slice(0, 8);         // only the next eight are shown
    var list = $("list");
    var two = items.length > 4;
    var rows = two ? 4 : Math.max(items.length, 1);
    list.classList.toggle("two", two);
    list.style.gridTemplateRows = "repeat(" + rows + ", auto)";
    var html = "";
    // Names fade from orange (next in line) to red (last in line).
    function shade(i) {
      var t = all.length > 1 ? i / (all.length - 1) : 0;
      var from = [255, 159, 28], to = [255, 48, 48];
      return "rgb(" + from.map(function (c, k) { return Math.round(c + (to[k] - c) * t); }).join(",") + ")";
    }
    items.forEach(function (it, i) {
      var l = line(info(it));
      html += '<div class="row"><span class="num">' + (i + 2) +
        '</span><div class="cell"><div class="who" style="color:' + shade(i) + '">' + esc(l.big) + '</div><div class="what mq">' + esc(l.small) + "</div></div></div>";
    });
    list.innerHTML = html;
    $("more").textContent = "";
    // Shrink until it fits (floor at 40% of normal size).
    var sc = 1;
    list.style.setProperty("--s", sc);
    while (sc > 0.4 && list.scrollHeight > list.clientHeight + 1) {
      sc -= 0.05;
      list.style.setProperty("--s", sc.toFixed(2));
    }
    setTimeout(marquee, 0);
  }

  // Start each big name at full size and step it down until it fits on one line.
  var fitCache = {};
  function fitOne(id, max, min) {
    var el = $(id);
    var key = el.textContent + "|" + window.innerWidth + "x" + window.innerHeight;
    if (fitCache[id] === key) return;
    fitCache[id] = key;
    var size = max;
    el.classList.remove("scroll");
    el.style.fontSize = size + "vh";
    while (size > min && el.scrollWidth > el.clientWidth + 1) {
      size -= 0.5;
      el.style.fontSize = size + "vh";
    }
  }
  // For each song line: if "Title · Artist" fits, show it. If not, alternate between
  // the title and the artist every few seconds with a quick fade.
  var SEP = "  \u00b7  ";
  var flip = false;
  function partsOf(el) {
    if (el.textContent !== el.getAttribute("data-shown")) el.setAttribute("data-full", el.textContent);
    return (el.getAttribute("data-full") || "").split(SEP);
  }
  function show(el, text) { el.textContent = text; el.setAttribute("data-shown", text); }
  function marquee() {
    var els = document.querySelectorAll(".mq");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], parts = partsOf(el);
      show(el, parts.join(SEP));
      if (parts.length > 1 && el.scrollWidth > el.clientWidth + 1) {
        el.setAttribute("data-alt", "1");
        show(el, flip ? parts[1] : parts[0]);
      } else {
        el.removeAttribute("data-alt");
      }
    }
  }
  setInterval(function () {
    flip = !flip;
    var els = document.querySelectorAll('.mq[data-alt="1"]');
    for (var i = 0; i < els.length; i++) els[i].classList.add("fade");
    setTimeout(function () {
      for (var i = 0; i < els.length; i++) {
        var parts = partsOf(els[i]);
        show(els[i], flip ? (parts[1] || parts[0]) : parts[0]);
        els[i].classList.remove("fade");
      }
    }, 350);
  }, 4000);

  function fitName() {
    if (!$("heroWrap").classList.contains("hidden")) fitOne("heroName", 10.8, 5);
    if (!$("nowBar").classList.contains("hidden")) fitOne("nowBarName", 10.8, 6.5);
  }
  window.addEventListener("resize", function () { fitCache = {}; fitName(); renderList(); });

  var pillTimer = null;
  function setPill(text, bad) {
    var p = $("pill");
    p.textContent = text;
    p.classList.toggle("bad", !!bad);
    p.classList.remove("hidden");
    clearTimeout(pillTimer);
    // Hide the "Live" pill after a few seconds so it doesn't sit on screen all night.
    if (!bad) pillTimer = setTimeout(function () { p.classList.add("hidden"); }, 4000);
  }

  // ---------------------------------------------------------------- code entry (D-pad friendly)
  var entry = "";
  function buildPad() {
    var keys = ["1","2","3","4","5","6","7","8","9","⌫","0","Go"];
    var pad = $("pad");
    pad.innerHTML = "";
    keys.forEach(function (k) {
      var b = document.createElement("button");
      b.textContent = k;
      if (k === "⌫" || k === "Go") b.className = "wide";
      b.addEventListener("click", function () { pressKey(k); });
      pad.appendChild(b);
    });
  }
  function drawCode() {
    var s = "";
    for (var i = 0; i < 6; i++) s += entry[i] ? esc(entry[i]) : '<span class="ph">•</span>';
    $("codeBox").innerHTML = s;
  }
  function pressKey(k) {
    $("setupMsg").textContent = "";
    if (k === "⌫") entry = entry.slice(0, -1);
    else if (k === "Go") return submitCode();
    else if (entry.length < 6) entry += k;
    drawCode();
  }
  function submitCode() {
    if (entry.length !== 6) { $("setupMsg").textContent = "The code has 6 digits."; return; }
    $("setupMsg").textContent = "Checking…";
    fetchSession(entry).then(function () {
      code = entry;
      save(STORE_KEY, code);
      showView();
    }).catch(function () {
      $("setupMsg").textContent = "No KaraFun session with that code. Is remote control on?";
    });
  }
  function showSetup() {
    clearTimeout(retryTimer);
    try { if (client && client.close) client.close(); } catch (e) {}
    client = null;
    entry = "";
    $("view").classList.add("hidden");
    $("setup").classList.remove("hidden");
    buildPad();
    drawCode();
    var first = $("pad").querySelector("button");
    if (first) first.focus();
  }
  function showView() {
    $("setup").classList.add("hidden");
    $("view").classList.remove("hidden");
    render();
    connect();
    keepAwake();
  }

  // ---------------------------------------------------------------- remote control keys
  // Arrow keys move focus between buttons (Silk usually does this itself; this is a fallback).
  function moveFocus(dir) {
    var scope = $("setup").classList.contains("hidden") ? $("menu") : $("pad");
    var btns = Array.prototype.slice.call(scope.querySelectorAll("button"));
    var i = btns.indexOf(document.activeElement);
    if (i < 0) { btns[0] && btns[0].focus(); return; }
    var cols = scope === $("pad") ? 3 : btns.length;
    var j = i;
    if (dir === "ArrowRight") j = i + 1;
    if (dir === "ArrowLeft") j = i - 1;
    if (dir === "ArrowDown") j = i + cols;
    if (dir === "ArrowUp") j = i - cols;
    if (btns[j]) btns[j].focus();
  }

  var menuTimer = null;
  function openMenu() {
    $("menu").classList.remove("hidden");
    $("btnFull").focus();
    armMenuTimer();
  }
  function closeMenu() { $("menu").classList.add("hidden"); if (document.activeElement) document.activeElement.blur(); }
  function armMenuTimer() { clearTimeout(menuTimer); menuTimer = setTimeout(closeMenu, 10000); }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    var inSetup = !$("setup").classList.contains("hidden");
    if (inSetup) {
      if (/^[0-9]$/.test(k)) { pressKey(k); e.preventDefault(); return; }
      if (k === "Backspace") { pressKey("⌫"); e.preventDefault(); return; }
      if (k.indexOf("Arrow") === 0) { moveFocus(k); e.preventDefault(); }
      return;
    }
    var menuOpen = !$("menu").classList.contains("hidden");
    if (!menuOpen && (k.indexOf("Arrow") === 0 || k === "Enter" || k === "ContextMenu")) {
      openMenu(); e.preventDefault(); return;
    }
    if (menuOpen) {
      armMenuTimer();
      if (k.indexOf("Arrow") === 0) { moveFocus(k); e.preventDefault(); }
    }
  });

  $("btnFull").addEventListener("click", function () {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
    closeMenu();
  });
  $("btnCode").addEventListener("click", function () { closeMenu(); showSetup(); });
  $("btnClose").addEventListener("click", closeMenu);

  // ---------------------------------------------------------------- keep the screen on
  var wakeLock = null;
  function keepAwake() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !$("view").classList.contains("hidden")) {
      keepAwake();
      // Coming back from the background: make sure we're still connected.
      if (!client) connect();
    }
  });

  // ---------------------------------------------------------------- Silk address bar
  function hideSilkBar() {
    document.documentElement.classList.add("silkfix");
    window.scrollTo(0, 300);
  }
  window.addEventListener("load", function () { setTimeout(hideSilkBar, 300); });
  setInterval(function () { if (window.scrollY < 290) hideSilkBar(); }, 5000);

  // ---------------------------------------------------------------- start
  if (params.has("code")) save(STORE_KEY, code);
  if (params.has("reset")) { save(STORE_KEY, null); code = ""; }
  if (/^\d{6}$/.test(code)) showView(); else showSetup();
})();
</script>
</body>
</html>
