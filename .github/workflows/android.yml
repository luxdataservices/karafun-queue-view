name: Build Fire TV app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jukebox-queue.apk

      - name: Publish to the "Fire TV app" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Fire TV app
          body: |
            Install on a Fire TV Stick with the Downloader app using this link:
            https://github.com/${{ github.repository }}/releases/latest/download/jukebox-queue.apk
          files: jukebox-queue.apk
          make_latest: true
